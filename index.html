<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
        <div class="screenbox" id="screenbox"></div>
        <div class="keyboard">
        <table style="border-collapse: collapse;">
            <tr class="container">
                <td class="cell" onclick="regClick('c')">C</td>
                <td class="cell" onclick="regClick('d')">DEL</td>
                <td class="cell" onclick="regClick('÷')">÷</td>
                <td class="cell" onclick="regClick('✕')">✕</td>
            </tr>
            <tr class="container">
                <td class="cell" onclick="regClick('7')">7</td>
                <td class="cell" onclick="regClick('8')">8</td>
                <td class="cell" onclick="regClick('9')">9</td>
                <td class="cell" onclick="regClick('+')">+</td>
            </tr>
            <tr class="container">
                <td class="cell" onclick="regClick('4')">4</td>
                <td class="cell" onclick="regClick('5')">5</td>
                <td class="cell" onclick="regClick('6')">6</td>
                <td class="cell" onclick="regClick('-')">-</td>
            </tr>
            <tr class="container">
                <td class="cell" onclick="regClick('1')">1</td>
                <td class="cell" onclick="regClick('2')">2</td>
                <td class="cell" onclick="regClick('3')">3</td>
                <td class="cell calc" rowspan="2" onclick="regClick('cal')">=</td>
            </tr>
            <tr class="container">
                <td class="cell" onclick="regClick('00')">00</td>
                <td class="cell" onclick="regClick('0')">0</td>
                <td class="cell" onclick="regClick('.')">.</td>
            </tr>
        </table>
        </div>
    </div>
</body>
<script>
    let value = "";
    const regClick = (k)=>{
        if(k === "✕"){
            k = "*"
            console.log(value, k)
            value += k
            document.getElementById("screenbox").innerHTML = value
        }
        else if(k === "÷"){
            k = "/"
            value += k
            document.getElementById("screenbox").innerHTML = value
        }
        else if(k === "c"){
            value = ""
            document.getElementById("screenbox").innerHTML = value
        }
        else if(k === "d"){
            value = String(value)
            value = value.slice(0, -1)
            document.getElementById("screenbox").innerHTML = value
        }
        else if(k === "cal" && value != ""){
            let sol = eval(value)
            value = sol
            document.getElementById("screenbox").innerHTML = value
        }else{
            value += k
            document.getElementById("screenbox").innerHTML = value

        }
    }
</script>
</html>
