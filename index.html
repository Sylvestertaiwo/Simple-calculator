<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
        <div class="screenbox"></div>
        <div class="keyboard">
        <table style="border-collapse: collapse;">
            <tr class="container">
                <td class="cell">C</td>
                <td class="cell">DEL</td>
                <td class="cell">÷</td>
                <td class="cell">✕</td>
            </tr>
            <tr class="container">
                <td class="cell">7</td>
                <td class="cell">8</td>
                <td class="cell">9</td>
                <td class="cell">+</td>
            </tr>
            <tr class="container">
                <td class="cell">4</td>
                <td class="cell">5</td>
                <td class="cell">6</td>
                <td class="cell">-</td>
            </tr>
            <tr class="container">
                <td class="cell">1</td>
                <td class="cell">2</td>
                <td class="cell">3</td>
                <td class="cell calc" rowspan="2">=</td>
            </tr>
            <tr class="container">
                <td class="cell">0</td>
                <td class="cell">.</td>
                <td class="cell"></td>
            </tr>
        </table>
        </div>
    </div>
</body>
</html>
