<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="parent">
        <div class="screenbox"> <div class="screen" id="screenbox"></div></div>
        <div class="keyboard">
        <table class="cell-container">
            <tr class="container">
                <td class="cell" onclick="regClick('c')">C</td>
                <td class="cell" onclick="regClick('d')">DEL</td>
                <td class="cell" onclick="regClick('÷')">÷</td>
                <td class="cell" onclick="regClick('✕')">✕</td>
            </tr>
            <tr class="container">
                <td class="cell" onclick="regClick('7')">7</td>
                <td class="cell" onclick="regClick('8')">8</td>
                <td class="cell" onclick="regClick('9')">9</td>
                <td class="cell" onclick="regClick('+')">+</td>
            </tr>
            <tr class="container">
                <td class="cell" onclick="regClick('4')">4</td>
                <td class="cell" onclick="regClick('5')">5</td>
                <td class="cell" onclick="regClick('6')">6</td>
                <td class="cell" onclick="regClick('-')">-</td>
            </tr>
            <tr class="container">
                <td class="cell" onclick="regClick('1')">1</td>
                <td class="cell" onclick="regClick('2')">2</td>
                <td class="cell" onclick="regClick('3')">3</td>
                <td class="cell calc" rowspan="2" onclick="regClick('cal')">=</td>
            </tr>
            <tr class="container">
                <td class="cell" onclick="regClick('0')">0</td>
                <td class="cell" onclick="regClick('√')">√</td>
                <td class="cell" onclick="regClick('.')">.</td>
            </tr>
        </table>
        </div>
    </div>
</body>
<script>
    let value = "";
    const regClick = (k)=>{
        if(k === "c"){
            value = ""
            document.getElementById("screenbox").innerHTML = value
        }
        else if(k === "d"){
            value = String(value)
            value = value.slice(0, -1)
            document.getElementById("screenbox").innerHTML = value
        }
        else if(k === "cal" && value === ""){
            return
        }
        else if(k === "cal" && value != ""){
            try{
            let newValue = value.replace(/✕/g, "*").replace(/÷/g, "/").replace(/√(\d+\.?\d*)/g, "Math.sqrt($1)")
            let sol = eval(newValue)
            value = sol
            if(value === "Infinity" || value === "Syntax Error" || value === "Math Error"){
                document.getElementById("screenbox").innerHTML = "Syntax Error"
            }else{
                document.getElementById("screenbox").innerHTML = value
            }
            }catch{
                document.getElementById("screenbox").innerHTML = "Syntax Error" 
            }
        }else{
            value += k
            document.getElementById("screenbox").innerHTML = value
        }
    }
</script>
</html>
